<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lissa · design mockups</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0c0e; color: #d4d4d8; font: 12px/1.4 'IBM Plex Mono', ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #222228; flex-wrap: wrap; flex-shrink: 0; }
  .bar b { color: #c8f060; letter-spacing: 0.12em; margin-right: 8px; white-space: nowrap; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group + .group { margin-left: 10px; padding-left: 12px; border-left: 1px solid #2a2a32; }
  .bar button, .bar select {
    flex: none; background: none; border: 1px solid #3a3a44; border-radius: 3px; color: #a1a1aa;
    font: inherit; padding: 4px 9px; cursor: pointer; white-space: nowrap;
  }
  .bar select { background: #0c0c0e; padding: 4px 6px; max-width: 190px; }
  .bar button:hover, .bar select:hover { color: #fff; border-color: #6a6a7b; }
  .bar button[aria-pressed="true"] { background: #c8f060; border-color: #c8f060; color: #0c0c0e; }
  .bar button:disabled, .bar select:disabled, .bar input:disabled { opacity: 0.35; cursor: default; }
  .bar label { color: #8b8b98; white-space: nowrap; }
  .bar input[type=color] { width: 30px; height: 24px; padding: 1px; border: 1px solid #3a3a44; border-radius: 3px; background: none; cursor: pointer; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }
  .note { padding: 6px 12px; color: #8b8b98; border-bottom: 1px solid #222228; flex-shrink: 0; }
  .note strong { color: #d4d4d8; font-weight: 500; }
  .note em { color: #c8f060; font-style: normal; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <nav class="bar" aria-label="Mockup controls">
    <b>LISSA MOCKUPS</b>
    <div class="group" id="themes" role="group" aria-label="Theme"></div>
    <div class="group seg" role="group" aria-label="Brightness">
      <button type="button" data-mode="bright">Bright</button>
      <button type="button" data-mode="dark">Dark</button>
    </div>
    <div class="group">
      <label for="accent">Highlight</label>
      <input type="color" id="accent" title="Highlight colour">
      <button type="button" id="accent-reset" title="Back to the theme's own highlight">theme</button>
    </div>
    <div class="group">
      <label for="font-text">Text</label>
      <select id="font-text"><option value="">theme font</option></select>
      <label for="font-title">Titles</label>
      <select id="font-title"><option value="">theme font</option></select>
    </div>
    <div class="group"><button type="button" id="reset-all">Reset all</button></div>
  </nav>
  <div class="note" id="note" aria-live="polite"></div>
  <iframe id="app" src="../index.html" title="lissa"></iframe>
<script src="apply-theme.js"></script>
<script>
  const { THEMES, FONTS, applyTheme } = window.LissaMockups;
  const $ = id => document.getElementById(id);
  const frame = $('app');
  const STORE = 'lissa.mockups';
  const THEME_BASE = new URL('themes/', location.href).href;

  // State: theme + mode live in the URL (#sage/dark) so a view can be linked;
  // the manual overrides are a per-browser convenience in localStorage.
  const state = { theme: 'instrument', mode: 'bright', accent: null, text: '', title: '' };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
  const [hTheme, hMode] = location.hash.slice(1).split('/');
  if (THEMES.some(t => t.id === hTheme)) state.theme = hTheme;
  if (hMode === 'dark' || hMode === 'bright') state.mode = hMode;
  if (!THEMES.some(t => t.id === state.theme)) state.theme = 'instrument';

  const themeButtons = new Map();
  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t.name;
    b.addEventListener('click', () => { state.theme = t.id; render(); });
    $('themes').appendChild(b);
    themeButtons.set(t.id, b);
  });
  for (const sel of [$('font-text'), $('font-title')]) {
    for (const [name, [, generic]] of Object.entries(FONTS)) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name + (generic === 'sans-serif' ? '' : ' · ' + generic);
      sel.appendChild(o);
    }
  }
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.addEventListener('click', () => { state.mode = b.dataset.mode; render(); }));
  $('accent').addEventListener('input', e => { state.accent = e.target.value; render(); });
  $('accent-reset').addEventListener('click', () => { state.accent = null; render(); });
  $('font-text').addEventListener('change', e => { state.text = e.target.value; render(); });
  $('font-title').addEventListener('change', e => { state.title = e.target.value; render(); });
  $('reset-all').addEventListener('click', () => { Object.assign(state, { accent: null, text: '', title: '' }); render(); });

  function render() {
    const win = frame.contentWindow;
    if (!win || !win.document || !win.document.body) return;
    const t = applyTheme(win, state.theme, THEME_BASE,
      { mode: state.mode, accent: state.accent, text: state.text, title: state.title });
    const custom = t.id !== 'current';
    themeButtons.forEach((b, id) => b.setAttribute('aria-pressed', id === t.id));
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode); b.disabled = !custom;
    });
    for (const id of ['accent', 'accent-reset', 'font-text', 'font-title', 'reset-all']) $(id).disabled = !custom;
    $('font-text').value = state.text; $('font-title').value = state.title;
    // Show the colour actually in use, the theme's own until one is picked.
    if (custom && !state.accent) {
      requestAnimationFrame(() => setTimeout(() => {
        const p = win.document.createElement('span'); p.style.color = 'var(--accent)'; win.document.body.appendChild(p);
        const m = win.getComputedStyle(p).color.match(/\d+/g); p.remove();
        if (m) $('accent').value = '#' + m.slice(0, 3).map(v => (+v).toString(16).padStart(2, '0')).join('');
      }, 150));
    } else if (state.accent) $('accent').value = state.accent;
    const over = [state.accent && 'highlight ' + state.accent, state.text && 'text in ' + state.text,
      state.title && 'titles in ' + state.title].filter(Boolean);
    $('note').innerHTML = '<strong>' + t.name + (custom ? ' · ' + (state.mode === 'dark' ? 'Dark' : 'Bright') : '') +
      '</strong> — ' + t.note + (custom && over.length ? ' <em>Overrides: ' + over.join(', ') + '.</em>' : '');
    history.replaceState(null, '', '#' + t.id + (custom ? '/' + state.mode : ''));
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }
  frame.addEventListener('load', render);

  // ← / → step through the themes when focus is out here, not inside the app.
  document.addEventListener('keydown', e => {
    if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.target.closest('select, input')) return;
    const i = THEMES.findIndex(t => t.id === state.theme);
    state.theme = THEMES[(i + (e.key === 'ArrowRight' ? 1 : -1) + THEMES.length) % THEMES.length].id;
    render();
  });
</script>
</body>
</html>
