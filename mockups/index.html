<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lissa · design mockups</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0c0e; color: #d4d4d8; font: 12px/1.4 'IBM Plex Mono', ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #222228; overflow-x: auto; flex-shrink: 0; }
  .bar b { color: #c8f060; letter-spacing: 0.12em; margin-right: 8px; white-space: nowrap; }
  .bar button {
    flex: none; background: none; border: 1px solid #3a3a44; border-radius: 3px; color: #a1a1aa;
    font: inherit; padding: 4px 9px; cursor: pointer; white-space: nowrap;
  }
  .bar button:hover { color: #fff; border-color: #6a6a7b; }
  .bar button[aria-pressed="true"] { background: #c8f060; border-color: #c8f060; color: #0c0c0e; }
  .bar .round { flex: none; color: #8b8b98; margin: 0 2px 0 10px; white-space: nowrap; }
  .note { padding: 6px 12px; color: #8b8b98; border-bottom: 1px solid #222228; flex-shrink: 0; }
  .note strong { color: #d4d4d8; font-weight: 500; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <nav class="bar" id="bar" aria-label="Theme"><b>LISSA MOCKUPS</b></nav>
  <div class="note" id="note" aria-live="polite"></div>
  <iframe id="app" src="../index.html" title="lissa"></iframe>
<script src="apply-theme.js"></script>
<script>
  const { THEMES, applyTheme } = window.LissaMockups;
  const bar = document.getElementById('bar');
  const note = document.getElementById('note');
  const frame = document.getElementById('app');
  // Buttons are grouped by round, numbered within it; newest round first.
  const DEFAULT = 'geist';
  const rounds = [...new Set(THEMES.map(t => t.round || 0))].sort((a, b) => (b || 99) - (a || 99));
  const order = rounds.flatMap(r => THEMES.filter(t => (t.round || 0) === r));
  const buttons = new Map();
  for (const r of rounds) {
    if (r) { const l = document.createElement('span'); l.className = 'round'; l.textContent = 'Round ' + r; bar.appendChild(l); }
    THEMES.filter(t => (t.round || 0) === r).forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = (r ? String(i + 1).padStart(2, '0') + ' ' : '') + t.name;
      b.addEventListener('click', () => select(t.id));
      bar.appendChild(b);
      buttons.set(t.id, b);
    });
  }
  function select(id) {
    const t = applyTheme(frame.contentWindow, id, new URL('themes/', location.href).href);
    buttons.forEach((b, id) => b.setAttribute('aria-pressed', id === t.id));
    note.innerHTML = '<strong>' + t.name + '</strong> — ' + t.note;
    history.replaceState(null, '', '#' + t.id);
  }
  frame.addEventListener('load', () => select(location.hash.slice(1) || DEFAULT));
  // ← / → step through the themes in bar order when focus is out here, not inside the app.
  document.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const cur = order.findIndex(t => t.id === (location.hash.slice(1) || DEFAULT));
    const n = (cur + (e.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length;
    select(order[n].id);
  });
</script>
</body>
</html>
